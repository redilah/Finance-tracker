<!doctype html>
<html lang="en" data-container-style="clear" data-blur-effect="wave" data-tx-scroll-anim="spring-up">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cassiel</title>
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="application-name" content="Cassiel" />
    <meta name="apple-mobile-web-app-title" content="Cassiel" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#F8EFE6" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Web App Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Great+Vibes&family=Herr+Von+Muellerhoff&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Monsieur+La+Doulaise&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      #app-splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0b0f19;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #app-splash-screen img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }
      #app-splash-screen.splash-exit {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
    <body>
    <!-- SVG Optical Refraction Filters (Snell Distortion & Liquid Waves as in reference) -->
    <svg style="position: fixed; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
      <defs>
        <!-- Varian 1: Liquid Wave (Riak Alami Cair - Mengalir Lembut) -->
        <filter id="distorsion" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.014 0.022" numOctaves="2" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="26" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="distorsion-wave" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.014 0.022" numOctaves="2" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="26" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <!-- Varian 2: Fluted Reeded Glass (Kaca Garis Katedral Moru - Arsitektural Mewah) -->
        <filter id="distorsion-fluted" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="turbulence" baseFrequency="0.065 0.0005" numOctaves="1" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="R" />
        </filter>

        <!-- Varian 3: Domed Lens (Lensa Cembung Kubah Arloji - Pembiasan Melengkung Besar) -->
        <filter id="distorsion-lens" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.006 0.008" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="38" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="app-splash-screen">
      <img src="/splash cassiel.jpg" alt="Cassiel Splash" />
    </div>
    <div id="root"></div>
    <script>
      // Fallback Safety Timer: Jamin splash screen hilang dalam 1.8 detik jika React mengalami delay
      setTimeout(function() {
        var splash = document.getElementById('app-splash-screen');
        if (splash) {
          splash.classList.add('splash-exit');
          setTimeout(function() {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 500);
        }
      }, 1800);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
