// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            // Let Gradle resolve Kotlin stdlib version transitively from capacitor-filesystem (Kotlin 2.2.20)
            // Do NOT force an older version — it will strip SpillingKt and crash at runtime
        }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.application') || project.plugins.hasPlugin('com.android.library')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        project.tasks.withType(JavaCompile).configureEach {
            options.compilerArgs += ['--release', '17']
        }
        if (project.extensions.findByName('java') != null) {
            project.java.toolchain.languageVersion.set(JavaLanguageVersion.of(17))
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
