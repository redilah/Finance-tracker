apply plugin: 'com.android.application'

android {
    namespace = "com.redilah.financetracker"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.redilah.financetracker"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 49
        versionName "1.0.49"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions = ["mode"]
    productFlavors {
        cassiel {
            dimension "mode"
            applicationId "com.redilah.financetracker"
        }
        sariel {
            dimension "mode"
            applicationId "com.redilah.financetracker.sariel"
        }
    }
    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: project.findProperty("KEYSTORE_PASSWORD") ?: 'redilah123'
            keyAlias System.getenv("KEY_ALIAS") ?: project.findProperty("KEY_ALIAS") ?: 'release-key'
            keyPassword System.getenv("KEY_PASSWORD") ?: project.findProperty("KEY_PASSWORD") ?: 'redilah123'
        }
    }
    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // Kotlin stdlib + Coroutines — required by @capacitor/filesystem (Kotlin 2.2.20)
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Google Play Billing Library 8.0.0 (100% Native Google Play Billing)
    implementation 'com.android.billingclient:billing:8.0.0'

    // Google Play Services Auth (Legacy Google Sign-In Fallback)
    implementation 'com.google.android.gms:play-services-auth:21.3.0'

    // Android Credential Manager & Google ID (Modern Bottom Sheet 1-Tap Sign-In like Grammarly)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.register('copyCassielApk') {
    doLast {
        def srcApk = layout.buildDirectory.file("outputs/apk/cassiel/release/app-cassiel-release.apk").get().asFile
        if (srcApk.exists()) {
            def targets = [
                rootProject.file("../apk/Cassiel.apk"),
                rootProject.file("../apk/app-release.apk"),
                rootProject.file("../apk/app-cassiel-release.apk"),
                rootProject.file("../Cassiel.apk")
            ]
            targets.each { target ->
                target.parentFile.mkdirs()
                srcApk.withInputStream { ins ->
                    target.withOutputStream { outs ->
                        outs << ins
                    }
                }
                println ">> [AUTO-SYNC CASSIEL APK] Copied to: ${target.absolutePath}"
            }
        }
    }
}

tasks.register('copySarielApk') {
    doLast {
        def srcApk = layout.buildDirectory.file("outputs/apk/sariel/release/app-sariel-release.apk").get().asFile
        if (srcApk.exists()) {
            def targets = [
                rootProject.file("../apk/Sariel.apk"),
                rootProject.file("../apk/app-sariel-release.apk"),
                rootProject.file("../Sariel.apk")
            ]
            targets.each { target ->
                target.parentFile.mkdirs()
                srcApk.withInputStream { ins ->
                    target.withOutputStream { outs ->
                        outs << ins
                    }
                }
                println ">> [AUTO-SYNC SARIEL] Copied to: ${target.absolutePath}"
            }
        }
    }
}

tasks.register('copyCassielBundle') {
    doLast {
        def srcAab = layout.buildDirectory.file("outputs/bundle/cassielRelease/app-cassiel-release.aab").get().asFile
        if (srcAab.exists()) {
            def targets = [
                layout.buildDirectory.file("outputs/bundle/release/app-release.aab").get().asFile,
                rootProject.file("../apk/app-release.aab"),
                rootProject.file("../apk/Cassiel.aab"),
                rootProject.file("../apk/Cassiel-Release.aab"),
                rootProject.file("../Cassiel.aab"),
                rootProject.file("../Cassiel-Release.aab")
            ]
            targets.each { target ->
                target.parentFile.mkdirs()
                srcAab.withInputStream { ins ->
                    target.withOutputStream { outs ->
                        outs << ins
                    }
                }
                println ">> [AUTO-SYNC CASSIEL AAB] Copied to: ${target.absolutePath}"
            }
        }
    }
}

gradle.projectsEvaluated {
    tasks.matching { it.name == 'assembleCassielRelease' || it.name == 'assembleRelease' }.configureEach { task ->
        task.finalizedBy('copyCassielApk')
    }
    tasks.matching { it.name == 'assembleSarielRelease' }.configureEach { task ->
        task.finalizedBy('copySarielApk')
    }
    tasks.matching { it.name == 'bundleCassielRelease' || it.name == 'bundleRelease' }.configureEach { task ->
        task.finalizedBy('copyCassielBundle')
    }
}

