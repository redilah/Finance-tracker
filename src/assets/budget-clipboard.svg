<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" fill="none">
  <!-- Clipboard Body with soft warm gradient & shadow -->
  <g filter="url(#shadowFilter)">
    <rect x="20" y="14" width="58" height="76" rx="14" fill="url(#boardGrad)" stroke="#E0C09E" stroke-width="2.5"/>
    
    <!-- Paper Sheet -->
    <rect x="27" y="23" width="44" height="60" rx="8" fill="#FFFDFB"/>
    
    <!-- Paper Content / Lines / Checkpoints -->
    <circle cx="35" cy="38" r="3.5" fill="#E8B88A"/>
    <rect x="42" y="36.5" width="22" height="3" rx="1.5" fill="#F0DCB8"/>
    
    <circle cx="35" cy="50" r="3.5" fill="#E8B88A"/>
    <rect x="42" y="48.5" width="20" height="3" rx="1.5" fill="#F0DCB8"/>
    
    <circle cx="35" cy="62" r="3.5" fill="#E8B88A"/>
    <rect x="42" y="60.5" width="24" height="3" rx="1.5" fill="#F0DCB8"/>
    
    <!-- Clipboard Top Clip -->
    <path d="M39 14V11C39 8.7909 40.7909 7 43 7H55C57.2091 7 59 8.7909 59 11V14H39Z" fill="#D4A373"/>
    <circle cx="49" cy="11" r="2" fill="#FFFDFB"/>
  </g>

  <!-- Big Plus Floating Action Badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="68" cy="74" r="18" fill="url(#plusGrad)"/>
    <path d="M68 66V82M60 74H76" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round"/>
  </g>

  <defs>
    <linearGradient id="boardGrad" x1="20" y1="14" x2="78" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE8D0"/>
      <stop offset="1" stop-color="#F5CE9F"/>
    </linearGradient>
    <linearGradient id="plusGrad" x1="50" y1="56" x2="86" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D4A373"/>
      <stop offset="1" stop-color="#BC6C25"/>
    </linearGradient>
    <filter id="shadowFilter" x="12" y="6" width="74" height="94" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#8C5828" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow" x="46" y="54" width="44" height="44" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#BC6C25" flood-opacity="0.32"/>
    </filter>
  </defs>
</svg>
