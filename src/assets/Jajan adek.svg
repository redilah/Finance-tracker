<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="candyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B8B"/>
      <stop offset="100%" stop-color="#FF8E53"/>
    </linearGradient>
    <linearGradient id="stickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Lollipop Stick -->
  <rect x="180" y="270" width="24" height="180" rx="12" fill="url(#stickGrad)" transform="rotate(-30 180 270)"/>
  
  <!-- Lollipop Candy Circle -->
  <circle cx="210" cy="210" r="110" fill="url(#candyGrad)" filter="drop-shadow(0 8px 16px rgba(255, 107, 139, 0.3))"/>
  <circle cx="210" cy="210" r="85" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <circle cx="210" cy="210" r="50" fill="none" stroke="#FFE4E6" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <circle cx="210" cy="210" r="20" fill="#FFFFFF"/>

  <!-- Cookie / Snack Treat -->
  <circle cx="340" cy="330" r="80" fill="#D97706" filter="drop-shadow(0 8px 16px rgba(217, 119, 6, 0.25))"/>
  <circle cx="340" cy="330" r="70" fill="#F59E0B"/>
  
  <!-- Choco Chips -->
  <circle cx="320" cy="300" r="10" fill="#78350F"/>
  <circle cx="365" cy="315" r="9" fill="#78350F"/>
  <circle cx="325" cy="350" r="11" fill="#78350F"/>
  <circle cx="360" cy="360" r="8" fill="#78350F"/>
  <circle cx="300" cy="335" r="7" fill="#78350F"/>

  <!-- Sparkles -->
  <path d="M120 100 Q 120 120 100 120 Q 120 120 120 140 Q 120 120 140 120 Q 120 120 120 100 Z" fill="#FBBF24"/>
  <path d="M380 140 Q 380 155 365 155 Q 380 155 380 170 Q 380 155 395 155 Q 380 155 380 140 Z" fill="#F472B6"/>
</svg>