<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="kipCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="goldCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Card Body -->
  <rect x="40" y="100" width="432" height="280" rx="24" fill="url(#kipCardGrad)" filter="drop-shadow(0 12px 24px rgba(29, 78, 216, 0.3))"/>
  <rect x="40" y="150" width="432" height="40" fill="#1E40AF" opacity="0.6"/>
  
  <!-- Smart Chip -->
  <rect x="80" y="210" width="60" height="45" rx="8" fill="#FBBF24"/>
  <rect x="86" y="216" width="48" height="33" rx="4" fill="none" stroke="#D97706" stroke-width="2"/>

  <!-- Card Numbers & Text -->
  <rect x="160" y="222" width="120" height="10" rx="5" fill="#93C5FD"/>
  <rect x="160" y="240" width="80" height="8" rx="4" fill="#60A5FA"/>
  <text x="80" y="335" fill="#FFFFFF" font-size="28" font-weight="bold" font-family="sans-serif" letter-spacing="2">KIP KULIAH</text>

  <!-- Graduation Cap Icon in top right -->
  <polygon points="390,140 440,165 390,190 340,165" fill="url(#goldCapGrad)"/>
  <polygon points="360,175 360,205 420,205 420,175 390,190" fill="#B45309"/>
  <circle cx="390" cy="145" r="4" fill="#FDE68A"/>
</svg>