name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Copy Assets to iOS Bundle
        run: |
          mkdir -p ios/App/App/public
          cp -r dist/* ios/App/App/public/
          echo "Web assets successfully copied into iOS bundle."

      - name: Build iOS App (.app & .ipa)
        run: |
          cd ios/App
          echo "Resolving Swift Packages..."
          xcodebuild -resolvePackageDependencies -project App.xcodeproj
          
          echo "Compiling iOS Release build with Xcode..."
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO > xcode_build.log 2>&1 || (echo "=== XCODE BUILD ERROR LOG ===" && tail -n 80 xcode_build.log && exit 1)

          # Create Payload directory and copy App.app
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          
          cd build
          zip -r Cassiel.ipa Payload
          cd ../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cassiel-iOS-IPA
          path: ios/App/build/Cassiel.ipa
          retention-days: 14
