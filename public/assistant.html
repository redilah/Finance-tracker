<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cassiel Assistant</title>
<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent; 
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: transparent;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Overlay dimmer ─── */
  .overlay {
    position: fixed; 
    inset: 0;
    background: rgba(0,0,0,0.42);
    z-index: 1;
    opacity: 0;
    animation: fadeIn 0.25s ease forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  /* ─── Bottom Sheet Card ─── */
  .sheet {
    position: relative;
    z-index: 10;
    background: #FAF3EC;
    border-radius: 28px 28px 0 0;
    padding: 12px 18px calc(16px + env(safe-area-inset-bottom, 12px));
    box-shadow: 0 -8px 40px rgba(120,80,20,0.18);
    transform: translateY(100%);
    animation: slideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
  }
  @keyframes slideUp { to { transform: translateY(0); } }
  
  .sheet-dismiss {
    animation: slideDown 0.25s ease forwards;
  }
  @keyframes slideDown { 
    to { 
      transform: translateY(100%); 
      opacity: 0; 
    } 
  }

  /* ─── Handle bar ─── */
  .handle {
    width: 42px; 
    height: 4.5px;
    background: rgba(160,130,100,0.35);
    border-radius: 999px;
    margin: 2px auto 12px;
    flex-shrink: 0;
  }

  /* ─── Header ─── */
  .header {
    display: flex; 
    align-items: center; 
    justify-content: space-between;
    margin-bottom: 14px;
    flex-shrink: 0;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-icon {
    width: 40px; 
    height: 40px; 
    background: linear-gradient(135deg, #F59E0B, #D97706);
    border-radius: 14px;
    display: flex; 
    align-items: center; 
    justify-content: center;
    box-shadow: 0 4px 14px rgba(217,119,6,0.28);
    flex-shrink: 0;
  }
  .header-icon svg { 
    width: 22px; 
    height: 22px; 
    fill: #FFFFFF; 
  }
  .header-text h1 {
    font-size: 17px; 
    font-weight: 800;
    color: #1F1914;
    line-height: 1.2;
  }
  .header-text p {
    font-size: 12px;
    color: #786C64;
    margin-top: 2px;
  }
  .close-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(160,130,100,0.12);
    color: #6B5B52;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .close-btn:active {
    background: rgba(160,130,100,0.25);
  }

  /* ─── Scrollable Chat & Cards Area ─── */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 4px 2px 14px;
    max-height: 60vh;
  }

  /* ─── Greeting / Assistant Message Bubble ─── */
  .bubble-assistant {
    align-self: flex-start;
    max-width: 90%;
    background: #FFFFFF;
    border-radius: 18px 18px 18px 6px;
    padding: 14px 16px;
    box-shadow: 0 2px 10px rgba(120, 80, 20, 0.06);
  }
  .bubble-assistant p.intro {
    font-size: 14px;
    color: #2D2319;
    font-weight: 600;
    line-height: 1.45;
    margin-bottom: 6px;
  }
  .bubble-assistant p.example {
    font-size: 12.5px;
    color: #786C64;
    line-height: 1.4;
  }

  /* ─── User Speech Bubble (Right Aligned Orange) ─── */
  .bubble-user {
    align-self: flex-end;
    max-width: 85%;
    background: linear-gradient(135deg, #F59E0B, #D97706);
    color: #FFFFFF;
    border-radius: 18px 18px 6px 18px;
    padding: 11px 16px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(217, 119, 6, 0.28);
    word-break: break-word;
    animation: popIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes popIn {
    0% { transform: scale(0.92); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ─── Transaction Preview Card ─── */
  .preview-card {
    background: #FFFFFF;
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 4px 18px rgba(120, 80, 20, 0.08);
    display: none;
    animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .preview-card.active {
    display: block;
  }

  .preview-card-header {
    font-size: 11.5px;
    font-weight: 800;
    color: #D97706;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .preview-card-top {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 14px;
    gap: 4px;
  }
  .preview-type-badge {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.6px;
    padding: 3px 12px;
    border-radius: 999px;
    background: #FEF3C7;
    color: #92400E;
    text-transform: uppercase;
  }
  .preview-type-badge.type-income {
    background: #D1FAE5;
    color: #065F46;
  }

  .preview-amount {
    font-size: 26px;
    font-weight: 800;
    color: #D97706;
    letter-spacing: -0.3px;
    margin-top: 2px;
  }
  .preview-amount.type-income {
    color: #059669;
  }

  .preview-rows {
    display: flex;
    flex-direction: column;
    margin-bottom: 14px;
  }
  .preview-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    font-size: 13.5px;
    border-top: 1px solid rgba(0, 0, 0, 0.05);
  }
  .preview-row-label {
    color: #6B7280;
    font-weight: 500;
  }
  .preview-row-val {
    color: #1F2937;
    font-weight: 700;
    text-align: right;
    max-width: 65%;
    word-break: break-word;
  }

  /* ─── Card Action Buttons (Batal / Kirim) ─── */
  .preview-actions {
    display: flex;
    gap: 10px;
  }
  .btn-action-cancel {
    flex: 1;
    height: 44px;
    background: #EFE6DC;
    border: none;
    border-radius: 14px;
    color: #374151;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .btn-action-cancel:active {
    background: #E4D8CC;
    transform: scale(0.98);
  }

  .btn-action-send {
    flex: 1;
    height: 44px;
    background: linear-gradient(135deg, #F59E0B, #D97706);
    border: none;
    border-radius: 14px;
    color: #FFFFFF !important;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(217, 119, 6, 0.32);
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .btn-action-send:active {
    transform: scale(0.98);
  }
  .btn-action-send:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* ─── Bottom Floating Input Bar ─── */
  .bottom-bar {
    position: relative;
    background: #FFFFFF;
    border-radius: 999px;
    display: flex;
    align-items: center;
    padding: 6px 8px 6px 18px;
    box-shadow: 0 4px 18px rgba(120, 80, 20, 0.12);
    margin-top: 4px;
    flex-shrink: 0;
  }
  .bottom-input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 14px;
    color: #1F2937;
    background: transparent;
    font-family: inherit;
    padding: 6px 0;
  }
  .bottom-input::placeholder {
    color: #9CA3AF;
  }

  .btn-mic-toggle {
    position: relative;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #4B5563;
    margin-right: 4px;
    transition: color 0.15s ease;
  }
  .btn-mic-toggle svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
    z-index: 2;
  }
  .btn-mic-toggle.listening {
    color: #D97706;
  }
  
  /* Pulsing Ripple on Mic Button */
  .mic-pulse-glow {
    display: none;
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    background: rgba(245, 158, 11, 0.25);
    animation: micPulseAnimation 1.4s infinite ease-out;
    z-index: 1;
  }
  .btn-mic-toggle.listening .mic-pulse-glow {
    display: block;
  }
  @keyframes micPulseAnimation {
    0% { transform: scale(0.9); opacity: 0.9; }
    50% { transform: scale(1.35); opacity: 0.35; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  .btn-send-arrow {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #F59E0B, #D97706);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #FFFFFF;
    box-shadow: 0 3px 10px rgba(217, 119, 6, 0.32);
    transition: transform 0.12s ease, opacity 0.15s ease;
    flex-shrink: 0;
  }
  .btn-send-arrow:active {
    transform: scale(0.92);
  }
  .btn-send-arrow svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: #FFFFFF;
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ─── Listening Status Toast inside Sheet ─── */
  .listening-indicator {
    display: none;
    font-size: 12px;
    font-weight: 600;
    color: #D97706;
    text-align: center;
    padding: 4px 0 2px;
    animation: fadeIn 0.2s ease;
  }
  .listening-indicator.active {
    display: block;
  }
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeAssistant()"></div>

<div class="sheet" id="sheet">
  <div class="handle"></div>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="header-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>Cassiel Assistant</h1>
        <p>Catat transaksi dengan suara</p>
      </div>
    </div>
    <button class="close-btn" onclick="closeAssistant()" aria-label="Tutup">✕</button>
  </div>

  <!-- Chat & Preview Area (Scrollable) -->
  <div class="chat-area" id="chatArea">
    <!-- Initial Greeting Bubble -->
    <div class="bubble-assistant">
      <p class="intro">Hai! 👋 Tekan tombol mic dan ucapkan transaksi kamu.</p>
      <p class="example">Contoh: "Beli mangga 5 biji 20 ribu pakai BRI"</p>
    </div>

    <!-- User Speech/Text Bubble (Dynamically Updated) -->
    <div class="bubble-user" id="userBubble" style="display: none;"></div>

    <!-- Transaction Preview Card -->
    <div class="preview-card" id="previewCard">
      <div class="preview-card-header">
        <span>✔</span> PREVIEW TRANSAKSI
      </div>

      <div class="preview-card-top">
        <span class="preview-type-badge" id="previewTypeBadge">PENGELUARAN</span>
        <div class="preview-amount" id="previewAmount">Rp 0</div>
      </div>

      <div class="preview-rows">
        <div class="preview-row">
          <span class="preview-row-label">Kategori</span>
          <span class="preview-row-val" id="previewCategory">Food</span>
        </div>
        <div class="preview-row">
          <span class="preview-row-label">Akun</span>
          <span class="preview-row-val" id="previewAccount">Cash</span>
        </div>
        <div class="preview-row">
          <span class="preview-row-label">Catatan</span>
          <span class="preview-row-val" id="previewNote">-</span>
        </div>
      </div>

      <div class="preview-actions">
        <button type="button" class="btn-action-cancel" onclick="handleCancelTransaction()">Batal</button>
        <button type="button" class="btn-action-send" id="btnSave" onclick="saveCurrentTransaction()">
          <span id="saveBtnText">Kirim</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Live listening indicator -->
  <div class="listening-indicator" id="listeningIndicator">
    🎙️ Mendengarkan suara Anda...
  </div>

  <!-- Bottom Floating Input Bar -->
  <form class="bottom-bar" id="inputForm" onsubmit="handleFormSubmit(event)">
    <input 
      type="text" 
      class="bottom-input" 
      id="textInput" 
      placeholder="Ketik transaksi..." 
      autocomplete="off"
    />

    <button type="button" class="btn-mic-toggle" id="micBtn" onclick="toggleListening()" aria-label="Rekam Suara">
      <div class="mic-pulse-glow"></div>
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>

    <button type="submit" class="btn-send-arrow" aria-label="Kirim Input">
      <svg viewBox="0 0 24 24">
        <line x1="12" y1="19" x2="12" y2="5"></line>
        <polyline points="5 12 12 5 19 12"></polyline>
      </svg>
    </button>
  </form>
</div>

<script>
  let isListening = false;
  let parsedTx = null;

  // Auto trigger speech recognition when opened
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      startListening();
    }, 350);
  });

  function startListening() {
    try {
      if (window.CassielAssistBridge && typeof CassielAssistBridge.startListening === 'function') {
        CassielAssistBridge.startListening();
      }
    } catch(e) {
      console.warn('Native bridge not available:', e);
    }
    isListening = true;
    updateUiState('listening');
  }

  function stopListening() {
    try {
      if (window.CassielAssistBridge && typeof CassielAssistBridge.stopListening === 'function') {
        CassielAssistBridge.stopListening();
      }
    } catch(e) {}
    isListening = false;
    updateUiState('idle');
  }

  function toggleListening() {
    if (isListening) {
      stopListening();
    } else {
      startListening();
    }
  }

  function updateUiState(state) {
    const micBtn = document.getElementById('micBtn');
    const indicator = document.getElementById('listeningIndicator');

    if (state === 'listening') {
      if (micBtn) micBtn.classList.add('listening');
      if (indicator) {
        indicator.classList.add('active');
        indicator.innerText = '🎙️ Mendengarkan suara Anda...';
      }
    } else {
      if (micBtn) micBtn.classList.remove('listening');
      if (indicator) {
        indicator.classList.remove('active');
      }
    }
  }

  // ─── Native Callbacks from Android SpeechRecognizer ───

  window.onSpeechPartial = function(text) {
    if (!text) return;
    const userBubble = document.getElementById('userBubble');
    if (userBubble) {
      userBubble.innerText = text;
      userBubble.style.display = 'block';
      scrollToBottom();
    }
  };

  window.onSpeechResult = function(finalText) {
    stopListening();
    if (!finalText || !finalText.trim()) return;

    processTransactionText(finalText.trim());
  };

  window.onSpeechError = function(errorMsg) {
    stopListening();
    const indicator = document.getElementById('listeningIndicator');
    if (indicator) {
      indicator.classList.add('active');
      indicator.innerText = '⚠️ ' + (errorMsg || 'Tidak mendengar suara. Coba lagi.');
      setTimeout(() => {
        indicator.classList.remove('active');
      }, 3000);
    }
  };

  // ─── Text Input Form Submit ───
  function handleFormSubmit(e) {
    if (e) e.preventDefault();
    const input = document.getElementById('textInput');
    const val = input ? input.value.trim() : '';
    if (!val) return;

    if (isListening) stopListening();
    input.value = '';
    input.blur();

    processTransactionText(val);
  }

  // ─── Process & Parse Transaction Text ───
  function processTransactionText(text) {
    // 1. Show user bubble
    const userBubble = document.getElementById('userBubble');
    if (userBubble) {
      userBubble.innerText = text;
      userBubble.style.display = 'block';
    }

    // 2. Parse via Java bridge or JS fallback
    let resultJson = null;
    try {
      if (window.CassielAssistBridge && typeof CassielAssistBridge.parseTransaction === 'function') {
        const jsonStr = CassielAssistBridge.parseTransaction(text);
        resultJson = typeof jsonStr === 'string' ? JSON.parse(jsonStr) : jsonStr;
      }
    } catch (e) {
      console.warn('Bridge parseTransaction failed:', e);
    }

    if (!resultJson || !resultJson.isValid || resultJson.amount <= 0) {
      resultJson = fallbackParseJs(text);
    }

    parsedTx = resultJson;
    renderPreviewCard(resultJson);
    scrollToBottom();
  }

  // ─── Render Preview Card (NO AUTO-SAVE COUNTDOWN) ───
  function renderPreviewCard(tx) {
    const card = document.getElementById('previewCard');
    if (!card) return;

    const isIncome = tx.type === 'income';
    const typeBadge = document.getElementById('previewTypeBadge');
    const amountEl = document.getElementById('previewAmount');
    const catEl = document.getElementById('previewCategory');
    const accEl = document.getElementById('previewAccount');
    const noteEl = document.getElementById('previewNote');

    if (typeBadge) {
      typeBadge.innerText = isIncome ? 'PEMASUKAN' : 'PENGELUARAN';
      if (isIncome) {
        typeBadge.classList.add('type-income');
      } else {
        typeBadge.classList.remove('type-income');
      }
    }

    if (amountEl) {
      amountEl.innerText = tx.formattedAmount || ('Rp ' + Number(tx.amount || 0).toLocaleString('id-ID'));
      if (isIncome) {
        amountEl.classList.add('type-income');
      } else {
        amountEl.classList.remove('type-income');
      }
    }

    if (catEl) catEl.innerText = tx.category || (isIncome ? 'Bonus' : 'Food');
    if (accEl) accEl.innerText = tx.account || 'Cash';
    if (noteEl) noteEl.innerText = tx.note || tx.category || 'Transaksi';

    card.classList.add('active');
    const btnSave = document.getElementById('btnSave');
    if (btnSave) {
      btnSave.disabled = false;
      document.getElementById('saveBtnText').innerText = 'Kirim';
    }
  }

  // ─── Save Transaction to Cassiel Core State ───
  function saveCurrentTransaction() {
    if (!parsedTx || parsedTx.amount <= 0) return;

    const btnSave = document.getElementById('btnSave');
    if (btnSave) btnSave.disabled = true;
    const saveBtnText = document.getElementById('saveBtnText');
    if (saveBtnText) saveBtnText.innerText = 'Menyimpan...';

    try {
      if (window.CassielAssistBridge && typeof CassielAssistBridge.saveTransaction === 'function') {
        CassielAssistBridge.saveTransaction(JSON.stringify(parsedTx));
      }
    } catch(e) {
      console.warn('Failed to call saveTransaction bridge:', e);
    }

    if (saveBtnText) saveBtnText.innerText = '✓ Berhasil!';
    setTimeout(() => {
      closeAssistant();
    }, 400);
  }

  function handleCancelTransaction() {
    closeAssistant();
  }

  // ─── Dismissing Assistant UI ───
  function closeAssistant() {
    stopListening();

    const sheet = document.getElementById('sheet');
    if (sheet) sheet.classList.add('sheet-dismiss');

    const overlay = document.getElementById('overlay');
    if (overlay) overlay.style.animation = 'fadeIn 0.2s ease reverse forwards';

    setTimeout(function() {
      try {
        if (window.CassielAssistBridge && typeof CassielAssistBridge.closeAssistant === 'function') {
          CassielAssistBridge.closeAssistant();
        } else {
          window.close();
        }
      } catch (e) {
        window.close();
      }
    }, 240);
  }

  function scrollToBottom() {
    const chatArea = document.getElementById('chatArea');
    if (chatArea) {
      setTimeout(() => {
        chatArea.scrollTo({
          top: chatArea.scrollHeight,
          behavior: 'smooth'
        });
      }, 50);
    }
  }

  // ─── JS Fallback Parser ───
  function fallbackParseJs(text) {
    const lower = text.toLowerCase();
    const isIncome = lower.includes('gaji') || lower.includes('masuk') || lower.includes('diterima') || lower.includes('bonus') || lower.includes('pemasukan');
    
    let amount = 0;
    const jtMatch = lower.match(/(\d+(?:[.,]\d+)?)\s*(?:juta|jt)/);
    if (jtMatch) amount = Math.round(parseFloat(jtMatch[1].replace(',', '.')) * 1000000);
    
    if (!amount) {
      const rbMatch = lower.match(/(\d+(?:[.,]\d+)?)\s*(?:ribu|rb|k)/);
      if (rbMatch) amount = Math.round(parseFloat(rbMatch[1].replace(',', '.')) * 1000);
    }

    if (!amount) {
      const rawMatch = lower.match(/(?:rp)?\s*(\d{1,3}(?:\.\d{3})+|\d+)/);
      if (rawMatch) amount = parseInt(rawMatch[1].replace(/\./g, ''), 10) || 0;
    }

    let account = 'Cash';
    if (lower.includes('bri') || lower.includes('brimo')) account = 'BRImo';
    else if (lower.includes('bca')) account = 'BCA';
    else if (lower.includes('mandiri') || lower.includes('livin')) account = "Livin' by Mandiri";
    else if (lower.includes('bni') || lower.includes('wondr')) account = 'Wondr by BNI';
    else if (lower.includes('gopay')) account = 'GoPay';
    else if (lower.includes('ovo')) account = 'OVO';
    else if (lower.includes('dana')) account = 'DANA';
    else if (lower.includes('shopee') || lower.includes('spay')) account = 'ShopeePay';

    let category = isIncome ? 'Bonus' : 'Food';
    let categoryId = isIncome ? 'bonus' : 'food';
    if (lower.includes('bensin') || lower.includes('spbu')) { category = 'Bensin'; categoryId = 'bensin'; }
    else if (lower.includes('kopi') || lower.includes('coffee')) { category = 'Coffee'; categoryId = 'coffee'; }
    else if (lower.includes('makan') || lower.includes('mie') || lower.includes('nasi') || lower.includes('food')) { category = 'Food'; categoryId = 'food'; }
    else if (lower.includes('gojek') || lower.includes('grab') || lower.includes('transport')) { category = 'Transportasi'; categoryId = 'transport'; }
    else if (lower.includes('gaji')) { category = 'Gaji'; categoryId = 'gaji'; }

    let note = cleanNoteJs(text);
    if (!note) note = category;

    return {
      isValid: amount > 0,
      type: isIncome ? 'income' : 'expense',
      amount: amount,
      formattedAmount: 'Rp ' + Number(amount).toLocaleString('id-ID'),
      category: category,
      categoryId: categoryId,
      account: account,
      note: note
    };
  }

  function cleanNoteJs(rawText) {
    if (!rawText) return '';
    let cleaned = rawText.trim();

    // 1. Remove slang number words
    cleaned = cleaned.replace(/\b(ceban|goceng|seceng|noceng|noban|goban|cepek|gopek)\b/gi, ' ');

    // 2. Remove amount patterns
    cleaned = cleaned.replace(/\b\d+(?:[.,]\d+)?\s*(?:juta|jt|million|m)\b/gi, ' ');
    cleaned = cleaned.replace(/\b\d+(?:[.,]\d+)?\s*(?:ribu|rb|k)\b/gi, ' ');
    cleaned = cleaned.replace(/(?:rp\.?|rupiah)?\s*\b\d{1,3}(?:\.\d{3})+\b/gi, ' ');
    cleaned = cleaned.replace(/(?:rp\.?|rupiah)?\s*\b\d+\b/gi, ' ');
    cleaned = cleaned.replace(/\b(rp|rupiah)\b/gi, ' ');

    // 3. Remove bank & account keywords
    cleaned = cleaned.replace(/\b(brimo|bri|bca|klikbca|livin'?\s*by\s*mandiri|livin|mandiri|wondr\s*by\s*bni|wondr|bni|seabank|sea\s*bank|bsi\s*mobile|bsi|jago|gopay|go-pay|ovo|dana|shopeepay|shopee\s*pay|spay|linkaja|link\s*aja|cash|tunai|qris)\b/gi, ' ');

    // 4. Remove preposition & connector keywords
    cleaned = cleaned.replace(/\b(pakai|pake|via|lewat|menggunakan|dengan|sebesar|sebanyak|senilai|ke\s*akun|dari\s*akun)\b/gi, ' ');
    cleaned = cleaned.replace(/\b(masuk\s*ke|masuk|diterima\s*di|diterima)\b/gi, ' ');

    // 5. Remove leftover punctuation and extra whitespace
    cleaned = cleaned.replace(/[,;\-_/\\|]/g, ' ');
    cleaned = cleaned.replace(/\s+/g, ' ').trim();

    if (!cleaned) return '';
    return cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
  }
