<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gabung Grup Keuangan — Cassiel Finance</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #FDFBF7 0%, #FAF3E8 100%);
      color: #27221F;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .join-card {
      width: 100%;
      max-width: 390px;
      background: #FFFFFF;
      border-radius: 28px;
      padding: 30px 24px 26px;
      box-shadow: 0 18px 45px rgba(217, 119, 6, 0.10), 0 4px 14px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(245, 158, 11, 0.22);
      text-align: center;
    }
    .brand-logo-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      background: #FEF3C7;
      color: #B45309;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-bottom: 10px;
    }
    .title {
      font-size: 20px;
      font-weight: 800;
      color: #27221F;
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13.5px;
      color: #78716C;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .code-box {
      background: #FFFBEB;
      border: 1.5px dashed #F59E0B;
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 20px;
    }
    .code-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #92400E;
      margin-bottom: 4px;
    }
    .code-value {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #D97706;
    }
    .btn-primary {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 15px 18px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      color: #FFFFFF !important;
      background: linear-gradient(135deg, #F59E0B, #D97706);
      box-shadow: 0 8px 22px rgba(217, 119, 6, 0.28);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      margin-bottom: 10px;
      transition: transform 0.15s ease;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      width: 100%;
      border: 1.5px solid #FDE68A;
      border-radius: 14px;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      color: #B45309;
      background: #FFFBEB;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      margin-bottom: 8px;
    }
    .btn-web {
      display: inline-block;
      margin-top: 6px;
      font-size: 12.5px;
      font-weight: 700;
      color: #78716C;
      text-decoration: underline;
    }
    .toast {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 700;
      color: #059669;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="join-card">
    <div class="brand-logo-wrap">
      <img src="/app-icon.png" alt="Cassiel Finance" />
    </div>
    <div class="badge-pill">✨ UNDANGAN GRUP BERSAMA</div>
    <h1 class="title" id="groupNameTitle">Grup Keuangan Cassiel</h1>
    <p class="subtitle">Kelola kas, iuran bulanan, dan pengeluaran bersama secara transparan di aplikasi <strong>Cassiel Finance</strong>.</p>

    <div class="code-box">
      <div class="code-label">Kode Undangan Grup</div>
      <div class="code-value" id="inviteCodeDisplay">CASSIEL</div>
    </div>

    <a href="#" id="openAppBtn" class="btn-primary">
      <span>Buka di Aplikasi Cassiel</span>
    </a>

    <button type="button" id="copyCodeBtn" class="btn-secondary">
      <span>Salin Kode Undangan</span>
    </button>

    <a href="/?g=CASSIEL" id="openWebBtn" class="btn-web">
      Atau buka langsung via Cassiel Web
    </a>

    <div class="toast" id="statusToast"></div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var rawCode = params.get('g') || params.get('joinGroup') || 'CASSIEL';
      var cleanCode = rawCode.replace(/[^a-zA-Z0-9]/g, '').toUpperCase() || 'CASSIEL';
      var groupName = params.get('name') || '';

      var codeEl = document.getElementById('inviteCodeDisplay');
      var titleEl = document.getElementById('groupNameTitle');
      var openAppBtn = document.getElementById('openAppBtn');
      var copyCodeBtn = document.getElementById('copyCodeBtn');
      var openWebBtn = document.getElementById('openWebBtn');
      var toastEl = document.getElementById('statusToast');

      codeEl.textContent = cleanCode;
      if (groupName.trim()) {
        titleEl.textContent = groupName.trim();
      }

      var webTargetUrl = window.location.origin + '/?g=' + encodeURIComponent(cleanCode);
      openWebBtn.setAttribute('href', webTargetUrl);

      var fallbackUrl = window.location.origin + '/join?g=' + encodeURIComponent(cleanCode) +
        (groupName ? '&name=' + encodeURIComponent(groupName) : '') + '&stay=1';

      // Intent URI khusus Android untuk langsung membuka aplikasi Cassiel yang terinstal
      var androidIntentUrl = 'intent://join?g=' + encodeURIComponent(cleanCode) +
        '#Intent;scheme=cassiel;package=com.redilah.financetracker;S.g=' + encodeURIComponent(cleanCode) +
        ';S.browser_fallback_url=' + encodeURIComponent(fallbackUrl) + ';end';

      var customSchemeUrl = 'cassiel://join?g=' + encodeURIComponent(cleanCode);

      function copyInviteCode(silent) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(cleanCode).then(function () {
            if (!silent) {
              toastEl.textContent = '✔ Kode "' + cleanCode + '" berhasil disalin!';
            }
          }).catch(function () {});
        }
      }

      function launchCassielApp() {
        copyInviteCode(true);
        var isAndroid = /Android/i.test(navigator.userAgent || '');
        if (isAndroid) {
          window.location.href = androidIntentUrl;
        } else {
          window.location.href = customSchemeUrl;
          setTimeout(function () {
            window.location.href = webTargetUrl;
          }, 1200);
        }
      }

      openAppBtn.addEventListener('click', function (e) {
        e.preventDefault();
        toastEl.textContent = 'Membuka aplikasi Cassiel...';
        launchCassielApp();
      });

      copyCodeBtn.addEventListener('click', function () {
        copyInviteCode(false);
      });

      // Otomatis langsung melompat ke aplikasi Cassiel saat link dibuka pertama kali
      if (params.get('stay') !== '1') {
        setTimeout(function () {
          var isAndroid = /Android/i.test(navigator.userAgent || '');
          if (isAndroid) {
            window.location.replace(androidIntentUrl);
          } else {
            window.location.href = customSchemeUrl;
          }
        }, 150);
      }
    })();
  </script>
</body>
</html>
